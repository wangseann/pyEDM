name: Extended validation

on:
  push:
    branches: ["master", "ci/**"]
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  MPLCONFIGDIR: ${{ github.workspace }}/.ci/matplotlib
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  external-pyedm:
    name: Independent pyEDM reference tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the fork and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test]"
          python ci/record_environment.py
          python -m pip freeze > test-results/dependencies.txt
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pao-unit/EDM_MDE_validation
          ref: bae270e568dd52830f57ab661380e700097aa58d
          path: external/EDM_MDE_validation
          persist-credentials: false
      - name: Check out the historical neighbor implementation for comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SugiharaLab/pyEDM
          ref: ad80c9de7aa7916f0d9fd4c67b390cfcd0eed874
          path: external/pyedm-before-ties
          persist-credentials: false
      - name: Diagnose changed EDim reference curves
        run: python ci/diagnose_edim.py
      - name: Run all 31 independent pyEDM reference tests against the fork
        working-directory: external/EDM_MDE_validation
        run: |
          PYTHONPATH="${{ github.workspace }}" python -m pytest -p ci.external_fixtures \
            -q test_Simplex.py test_SMap.py test_CCM.py test_EDim.py \
            --timeout=1200 --durations=31 \
            --junitxml="${{ github.workspace }}/test-results/external.xml"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: external-pyedm
          path: test-results/*
          if-no-files-found: error
